<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="A speech bubble">
  <!-- The assistant's tab. Theme-aware ink, as in favicon.svg. This page has no
       button on the homepage to match, so the bubble answers to the nav's
       "Ask" instead. -->
  <style>
    :root { --ink: #858585; }
    @media (prefers-color-scheme: light) { :root { --ink: #131313; } }
    @media (prefers-color-scheme: dark)  { :root { --ink: #ffffff; } }
  </style>
  <g fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 14.5a2.5 2.5 0 0 1-2.5 2.5H8l-5 4V5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5z"/>
  </g>
</svg>
