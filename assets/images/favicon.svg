<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="A four-bar linkage">
  <!-- The site is monochrome, so a fixed ink would vanish against one tab strip
       or the other. Chrome and Firefox honour prefers-color-scheme inside an
       SVG favicon; anything that does not falls back to the mid grey, which
       stays legible either way. -->
  <style>
    :root { --ink: #858585; --pin: #858585; }
    @media (prefers-color-scheme: light) { :root { --ink: #131313; --pin: #555555; } }
    @media (prefers-color-scheme: dark)  { :root { --ink: #ffffff; --pin: #a1a1a1; } }
  </style>
  <!-- A four-bar crank-rocker: two grounded pivots, a crank, a coupler, a rocker. -->
  <g fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 24 L11 11 L24 15 L26 24"/>
  </g>
  <g fill="var(--ink)">
    <circle cx="11" cy="11" r="2.6"/>
    <circle cx="24" cy="15" r="2.6"/>
  </g>
  <g fill="var(--pin)">
    <path d="M6 24 l-3.4 5 h6.8 z"/>
    <path d="M26 24 l-3.4 5 h6.8 z"/>
  </g>
</svg>
